name: Radio checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check radio.js
          node --input-type=module --check < africa-map.js
          node --input-type=module --check < expanded-player.js
      - name: Static page checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text()
          js=Path('radio.js').read_text()
          for expected in ('<title>TUNE.AFRICAN</title>', 'ARPLogo.png', 'favi.png', 'radio.js', 'id="stations"', 'id="audio"', 'id="search"', 'id="country"', 'id="toggle"'):
              assert expected in page, f'Missing page element: {expected}'
          for expected in ('localStorage', 'fetchStations', 'playStation', 'favourites()', 'aria-pressed'):
              assert expected in js, f'Missing player capability: {expected}'
          map_js=Path('africa-map.js').read_text()
          for expected in ('id="africa-map"', 'id="map-status"', 'id="player-art"', 'id="next-station"', 'id="recent-stations"', 'africa-map.js'):
              assert expected in page, f'Missing Phase 3 element: {expected}'
          for expected in ('radio:country', 'THREE.WebGLRenderer', 'raycaster.intersectObjects', 'countryCode'):
              assert expected in map_js, f'Missing 3D map capability: {expected}'
          for expected in ('recentStations', 'rememberStation', 'next-station', 'radio:country'):
              assert expected in js, f'Missing enhanced player capability: {expected}'
          for expected in ('THREE.OrthographicCamera', 'camera.left=-halfWidth', 'camera.top=halfHeight', 'function resize()', 'function hover(event)', 'hitTest(event)', 'showCountryTooltip(hit.userData.name,hit.userData.code)', 'bounds.getCenter', 'mapCentre.set(-centre.x,-centre.y)'):
              assert expected in map_js, f'Missing map fit or hover behaviour: {expected}'
          assert '.map-tooltip' in page and '.map-tooltip[hidden]' in page
          assert 'africa-map.js?v=23' in page
          assert 'renderer.setSize(w,h);' in map_js, 'Canvas CSS size must track container dimensions'
          assert 'renderer.setSize(w,h,false)' not in map_js, 'Do not disable renderer CSS sizing on high-DPI screens'
          assert '.map-wrap canvas{display:block;cursor:grab;width:100%;height:100%}' in page
          assert 'radio.js?v=24' in page
          for expected in ('id="explorer-view"', 'id="directory-view"', 'id="back-to-map"', 'class="explorer-account-actions"', 'id="directory-title"'):
              assert expected in page, f'Missing two-view navigation: {expected}'
          for expected in ('function showView(code)', 'function route()', "location.hash='#/country/'", "location.hash='#/explore'", "window.addEventListener('hashchange',route)"):
              assert expected in js, f'Missing country navigation: {expected}'
          for expected in ('id="genre-chips"', 'id="sort"', 'id="clear-search"', 'id="player-expanded"', 'id="expanded-toggle"', 'id="previous-station"', 'id="retry-stream"', 'id="live-indicator"', 'id="expand-player"'):
              assert expected in page, f'Missing Phase 4 UI: {expected}'
          for expected in ('function updateGenreChips()', 'function setPlaybackState(state)', 'function sortStations(items)', 'function closeExpanded()', "els.audio.addEventListener('waiting'", "els.audio.addEventListener('stalled'", "els.audio.addEventListener('error'", "function stepStation(delta)"):
              assert expected in js, f'Missing Phase 4 logic: {expected}'
          assert 'grid-template-columns:repeat(2,minmax(0,1fr))' in page, 'Missing tablet/mobile cards'
          assert 'grid-template-columns:1fr' in page, 'Missing narrow-screen cards'
          assert 'africa-map.js?v=23' in page, 'Phase 3 map must be unchanged'
          assert '<img class="brand-logo" src="./ARPLogo.png"' in page
          assert 'id="clear-recent"' in page
          assert 'function clearRecentStations()' in js
          assert "localStorage.removeItem(recentKey)" in js
          assert "$('clear-recent').addEventListener('click',clearRecentStations)" in js
          assert '.map-wrap::before' in page and 'pointer-events:none;z-index:2' in page
          assert '.directory-heading::before' in page and '.expanded-card::before' in page
          for expected in ('body.explorer-active{overflow:hidden}', 'body.explorer-active>header{display:none}', 'class="explorer-toolbar"', 'class="explorer-logo"', 'background-size:cover', 'height:calc(100dvh - var(--explorer-player-height,90px))'):
              assert expected in page, f'Missing immersive layout: {expected}'
          for expected in ('const countryGroups=new Map()', 'function setHover(code)', 'country.group.position.z=country.lift', 'country.target=hovered?1.4:live?.65:0', 'border.material.color.setHex(hovered?0xffe2a0:live?0xffd17a:0xc1954b)', "setHover(hit?.userData.code||null)"):
              assert expected in map_js, f'Missing 3D hover elevation: {expected}'
          for expected in ("document.body.classList.toggle('explorer-active',!showDirectory)", 'function fitExplorerPlayer()', 'new ResizeObserver(fitExplorerPlayer)'):
              assert expected in js, f'Missing viewport/player integration: {expected}'
          for expected in ('id="map-zoom-in"', 'id="map-zoom-out"', 'id="map-zoom-reset"', 'class="map-zoom-controls"'):
              assert expected in page, f'Missing zoom UI: {expected}'
          for expected in ('THREE.ExtrudeGeometry', 'depth:.28', 'country.target=hovered?1.4:live?.65:0', "addEventListener('wheel'", 'function setZoom(value)', 'zoomLimits={min:0.8,max:3.5}', "getElementById('map-zoom-reset')"):
              assert expected in map_js, f'Missing raised geometry or zoom: {expected}'
          for expected in ('const pan=new THREE.Vector2()', 'function clampPan()', "mode:camera.zoom>1.01&&!e.shiftKey?'pan':'rotate'", "if(down.mode==='pan')", 'pan.x+=dx*', 'pan.y-=dy*', 'pan.set(0,0);setZoom(1)'):
              assert expected in map_js, f'Missing zoomed map pan: {expected}'
          assert 'Drag to pan when zoomed' in page and 'Shift-drag to tilt' in page
          for expected in ("new CustomEvent('radio:playback'", "state,code:current?.countrycode?.toUpperCase()||null"):
              assert expected in js, f'Missing player broadcast state: {expected}'
          for expected in ("function setBroadcast(code,name)", "addEventListener('radio:playback'", "new THREE.RingGeometry", "function addBroadcastRings(country)", "country.code===broadcastCode", "ring.visible=live&&!reducedMotion", "if(pendingBroadcast)setBroadcast"):
              assert expected in map_js, f'Missing broadcast map animation: {expected}'
          assert '.map-broadcast-label[hidden]' in page
          assert '.grid.has-playing .station:not(.is-playing) .play' in page
          assert '.grid.has-playing .station.is-playing .play' in page
          for expected in ("els.stations.classList.toggle('has-playing',animating)", "card.classList.toggle('is-playing',active&&animating)", "play.setAttribute('aria-pressed',String(playing))", "syncStationAnimations(animating)"):
              assert expected in js, f'Missing active station button emphasis: {expected}'
          expanded=Path('expanded-player.js').read_text()
          for expected in ('id="expanded-stage"', 'id="expanded-country"', 'id="expanded-equaliser"', 'expanded-player.js?v=1', '@media(prefers-reduced-motion:reduce)', 'radio.js?v=24'):
              assert expected in page, f'Missing expanded player animation UI: {expected}'
          for expected in ('THREE.WebGLRenderer', 'THREE.TorusGeometry', "addEventListener('radio:playback'", "addEventListener('radio:expanded'", 'function resetTilt()', 'function stop()', 'if(reduced.matches)resetTilt()'):
              assert expected in expanded, f'Missing expanded player animation: {expected}'
          assert "new CustomEvent('radio:expanded'" in js
          assert 'class="expanded-card"' in page
          assert '.station .station-expand' in page
          assert "make('button','btn station-expand','⛶')" in js
          assert "if(current?.stationuuid!==s.stationuuid)playStation(s)" in js
          assert "$('expand-player').click()" in js
          assert 'id="expanded-favourite"' in page
          assert '#expanded-favourite{position:absolute;top:14px;left:14px;' in page
          assert "function syncExpandedFavourite()" in js
          assert "$('expanded-favourite').addEventListener('click'" in js
          assert 'id="expanded-map"' in page
          assert '#expanded-map{position:absolute;top:16px;left:50%' in page
          assert "$('expanded-map').addEventListener('click'" in js
          assert "location.hash='#/explore'" in js
          assert page.count('aria-label="Station category"') == 1
          assert page.index('id="directory-subtitle"') < page.index('aria-label="Station category"') < page.index('class="controls"')
          assert '.directory-heading .tabs' in page
          for expected in ('.station.is-playing .station-art-wrap::before', '.station.is-playing .station-live-equaliser', '@keyframes station-border-glow', '@keyframes station-radio-wave', '@keyframes station-equaliser', '@media(prefers-reduced-motion:reduce)'):
              assert expected in page, f'Missing playing-station animation: {expected}'
          for expected in ("make('div','station-art-wrap')", "make('span','station-live-equaliser')", "card.classList.toggle('is-playing',active&&animating)"):
              assert expected in js, f'Missing playback-aware station animation: {expected}'
          assert '.directory-heading::before{opacity:1;z-index:0}' in page
          assert '.directory-heading>*{position:relative;z-index:1}' in page
          assert '.map-wrap::before' in page
          assert 'data-mode="diaspora"' in page
          for expected in ('DIASPORA_REGIONS', "'Caribbean':", "'United Kingdom & Europe':", "'North America':", "'Central & South America':", "'Middle East & Asia-Pacific':", "mode==='diaspora'", "document.createElement('optgroup')", "els.country.value='JM'"):
              assert expected in js, f'Missing diaspora discovery feature: {expected}'
          for expected in ('function syncStationAnimations(animating)', "card.dataset.stationId=s.stationuuid", "card.classList.toggle('is-playing',active&&animating)", "classList.toggle('is-live',animating)"):
              assert expected in js, f'Missing animation persistence fix: {expected}'
          assert '.player-expanded.is-live .expanded-stage::after' in page
          assert 'class="explorer-account-actions"' in page
          assert 'Registration coming soon' in page and 'Sign in coming soon' in page
          assert "'browse-all'" not in js
          assert "background-position:center 14%;background-size:auto clamp(760px,110vh,1250px)" in page
          assert "@media(max-width:800px){.map-wrap::before" in page
          assert "pointer-events:none;z-index:2" in page
          for expected in ('function addLiveEffects(country)', 'country.group.position.z=country.lift+pulse', 'country.equaliser.length', 'bar.scale.y=', "state==='buffering'"):
              assert expected in map_js, f'Missing live map animation: {expected}'
          for expected in ('country.trail.visible=visible', 'country.borderGlow.visible=visible', 'const head=(time/6%1)*path.total', 'const lengths=[0]'):
              assert expected in map_js, f'Missing border trail improvement: {expected}'
          assert 'id="player-map-shortcut"' in page
          assert '.player-map-shortcut:hover' in page
          assert "$('player-map-shortcut').addEventListener('click'" in js
          assert 'for(let i=0;i<24;i++)' in map_js
          assert 'country.trail.children.length' in map_js
          assert 'if(country.trail){' in map_js
          assert 'country.trail.visible=visible' in map_js
          assert 'country.tracer.position.copy' not in map_js
          assert 'new THREE.SphereGeometry(.038,12,8)' not in map_js
          assert 'new THREE.PlaneGeometry(1,1)' in map_js
          assert 'ribbon.userData.beamWidth=width' in map_js
          assert 'ribbon.scale.set(length,ribbon.userData.beamWidth,1)' in map_js
          assert 'new THREE.SphereGeometry(.038,12,8)' not in map_js
          assert '<svg viewBox="0 0 110 116"' in page
          assert 'M17.7 51.8 L5.9 40.7' in page
          assert 'M97.4 80.7 L97.0 79.8' in page
          assert 'transform:translateY(22px) rotateX(var(--tilt-x))' in page
          assert '#expanded-map svg{' in page
          assert 'aria-label="Return to Africa Explorer map"><svg viewBox="0 0 110 116"' in page
          assert 'bevelEnabled:true' in map_js
          assert 'new THREE.MeshStandardMaterial' in map_js
          assert 'const rimLight=new THREE.DirectionalLight' in map_js
          assert 'mesh.userData.terrain' in map_js
          assert 'depth:.28' in map_js
          assert 'id="map-country-search"' not in page
          assert 'countrySearch' not in map_js
          assert 'function showCountryTooltip(name,code)' in map_js
          assert 'function loadStationCounts()' in map_js
          assert '/json/countrycodes' in map_js
          assert 'showCountryTooltip(hit.userData.name,hit.userData.code)' in map_js
          assert 'Click to explore' not in map_js
          assert 'map-country-flag' in page
          assert page.index('data-mode="diaspora"') < page.index('data-mode="world"')
          assert 'class="directory-logo-link" href="#/explore"' in page
          assert '.directory-heading::before{content:none}' in page
          assert 'id="header-country-flag"' in page
          assert 'headerFlag.hidden=!isCountry' in js
          assert 'flagcdn.com/w80/' in js
          assert "els.country.value='JM'" in js
          assert "els.country.value='GB'" not in js
          assert "els.country.value='JM';" in js
          assert "els.country.value='GB';" not in js
          print('Static checks passed')
          PY
